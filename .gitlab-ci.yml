stages: [test]

# one pipeline per change: MR pipelines for merge requests, branch pipelines otherwise
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

default:
  # pinned so the base os does not change under us; ui-e2e overrides it with the playwright image
  image: python:3.12-bookworm
  interruptible: true

ui-e2e:
  stage: test
  timeout: 20m
  # browsers and system deps are baked in, keep the tag in step with playwright in requirements.txt
  image: mcr.microsoft.com/playwright/python:v1.48.0-jammy
  # results are in the html report, traces and junit tab; don't block the pipeline on them
  allow_failure: true
  cache:
    key:
      files: [part1-e2e/requirements.txt]
    paths: [.cache/pip]
  before_script:
    - cd part1-e2e
    - pip install -r requirements.txt
  script:
    # the public demo store is shared and sometimes slow, retry before calling it a failure
    - pytest --reruns 2 --reruns-delay 3 --junitxml=reports/junit.xml
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - part1-e2e/reports/
      - part1-e2e/test-results/
    reports:
      junit: part1-e2e/reports/junit.xml

api:
  stage: test
  timeout: 10m
  cache:
    key:
      files: [part2-api/requirements.txt]
    paths: [.cache/pip]
  # OSM_DEV_TOKEN comes from Settings > CI/CD > Variables; without it the write tests are skipped
  before_script:
    - cd part2-api
    - pip install -r requirements.txt
  script:
    - pytest --junitxml=reports/junit.xml
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - part2-api/reports/
    reports:
      junit: part2-api/reports/junit.xml

load:
  stage: test
  timeout: 10m
  # sends 1000 requests to a public site, so it only runs when started by hand
  rules:
    - when: manual
  allow_failure: true
  cache:
    key:
      files: [part3-load/requirements.txt]
    paths: [.cache/pip]
  before_script:
    - cd part3-load
    - pip install -r requirements.txt
  script:
    - python run_load_test.py
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - part3-load/reports/
