name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_load:
        description: Run the load test against the public demo site
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    container:
      image: mcr.microsoft.com/playwright/python:v1.48.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        working-directory: part1-e2e
        run: pip install -r requirements.txt
      - name: Run UI tests
        working-directory: part1-e2e
        env:
          LOGIN_NAME: ${{ secrets.LOGIN_NAME }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
          LOGIN_FIRST_NAME: ${{ secrets.LOGIN_FIRST_NAME }}
        run: |
          mkdir -p reports
          pytest --reruns 2 --reruns-delay 3 --junitxml=reports/junit.xml
      - name: Upload UI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-reports
          path: |
            part1-e2e/reports/
            part1-e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: part2-api/requirements.txt
      - name: Install dependencies
        working-directory: part2-api
        run: pip install -r requirements.txt
      - name: Run API tests
        working-directory: part2-api
        env:
          OSM_DEV_TOKEN: ${{ secrets.OSM_DEV_TOKEN }}
        run: |
          mkdir -p reports
          pytest --junitxml=reports/junit.xml
      - name: Upload API reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-reports
          path: part2-api/reports/
          if-no-files-found: ignore
          retention-days: 14

  load:
    if: github.event_name == 'workflow_dispatch' && inputs.run_load
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: part3-load/requirements.txt
      - name: Install dependencies
        working-directory: part3-load
        run: pip install -r requirements.txt
      - name: Run load test
        working-directory: part3-load
        run: python run_load_test.py
      - name: Upload load-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-reports
          path: part3-load/reports/
          if-no-files-found: ignore
          retention-days: 14
